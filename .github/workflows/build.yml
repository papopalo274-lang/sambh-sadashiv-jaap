name: Build Naam Jaap APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v3-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev lld ccache \
            build-essential libltdl-dev

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Install Python tools
        run: |
          pip install --upgrade pip
          pip install \
            buildozer==1.5.0 \
            cython==0.29.33 \
            virtualenv \
            sh==1.14.3

      - name: Accept Android licenses
        run: |
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

      - name: Check APK
        if: always()
        run: |
          echo "=== bin/ folder ==="
          ls -la bin/ 2>/dev/null || echo "bin/ not found"
          echo "=== All APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"
          echo "=== Last 30 lines of build log ==="
          tail -30 build.log 2>/dev/null || echo "No build log"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaamJaap-debug-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
