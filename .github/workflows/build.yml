```yaml
name: Build Naam Jaap APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            ccache


      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.33 \
            virtualenv


      - name: Show versions
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== JAVA ====="
          java -version

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== CYTHON ====="
          cython --version


      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-py311-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
          restore-keys: |
            buildozer-py311-


      - name: Clean previous build
        run: |
          buildozer android clean || true


      - name: Build APK
        run: |
          mkdir -p logs

          echo "===== START BUILDOZER BUILD ====="

          buildozer -v android debug 2>&1 | tee logs/build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "Buildozer exit code: ${BUILD_EXIT}"

          exit ${BUILD_EXIT}


      - name: Inspect build output
        if: always()
        run: |
          echo "======================================"
          echo "CURRENT DIRECTORY"
          echo "======================================"
          pwd

          echo "======================================"
          echo "ROOT FILES"
          echo "======================================"
          ls -la

          echo "======================================"
          echo "BIN DIRECTORY"
          echo "======================================"

          if [ -d bin ]; then
            ls -lah bin
          else
            echo "bin directory does not exist"
          fi

          echo "======================================"
          echo "SEARCHING FOR APK FILES"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

          echo "======================================"
          echo "SEARCHING FOR AAB FILES"
          echo "======================================"

          find . -type f -name "*.aab" -print || true


      - name: Verify APK
        run: |
          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo "APK count: ${APK_COUNT}"

          if [ "${APK_COUNT}" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            echo ""
            echo "The Buildozer log must be checked."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          find . -type f -name "*.apk" -print


      - name: Collect APK
        if: success()
        run: |
          mkdir -p artifacts

          find . -type f -name "*.apk" -exec cp {} artifacts/ \;

          echo "Collected APK files:"
          ls -lah artifacts


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NaamJaap-v2-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30


      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaamJaap-build-log
          path: logs/build.log
          if-no-files-found: warn
          retention-days: 14
```
