name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          ninja-build \
          ccache \
          zip \
          unzip

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Build Tools
      shell: bash
      run: |
        # Accept licenses
        yes | sdkmanager --licenses || true
        
        # Install required SDK packages for Android API 33
        sdkmanager --update
        sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.0" \
          "ndk;25.1.8937393"
        
        # Set environment variables
        echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/build-tools/33.0.0" >> "$GITHUB_PATH"
        
        # Verify aidl is available
        ls -la "$ANDROID_HOME/build-tools/33.0.0/aidl"

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33
        pip install buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
