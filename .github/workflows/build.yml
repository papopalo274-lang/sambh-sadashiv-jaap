name: Build Naam Jaap APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Python 3.11
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # System dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            ccache


      # --------------------------------------------------
      # Python build tools
      # --------------------------------------------------
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.33 \
            virtualenv


      # --------------------------------------------------
      # Verify environment
      # --------------------------------------------------
      - name: Show build versions
        run: |
          python --version
          pip --version
          java -version
          buildozer --version
          cython --version


      # --------------------------------------------------
      # Cache Buildozer
      # --------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: |
            buildozer-${{ runner.os }}-py311-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('main.py') }}
          restore-keys: |
            buildozer-${{ runner.os }}-py311-


      # --------------------------------------------------
      # Clean old build
      # --------------------------------------------------
      - name: Clean previous build
        run: |
          buildozer android clean || true


      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          mkdir -p logs

          buildozer -v android debug 2>&1 | tee logs/build.log


      # --------------------------------------------------
      # Check APK
      # --------------------------------------------------
      - name: Check APK output
        run: |
          echo "APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaamJaap-v2-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------
      # Upload build log
      # --------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaamJaap-build-log
          path: logs/build.log
          if-no-files-found: warn
          retention-days: 14
